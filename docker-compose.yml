# ─────────────────────────────────────────────────────────────────────────────
# aia-mcp — docker-compose
# Levanta todos los servidores MCP en modo HTTP (paralelo).
# ─────────────────────────────────────────────────────────────────────────────

services:
  aia-mcp:
    image: keitarodxs/aia-mcp:${AIA_MCP_TAG:-latest}
    container_name: aia-mcp
    restart: unless-stopped

    # Carga variables desde .env si existe (ver .env.example).
    # `required: false` para que el despliegue no falle si no hay .env
    # (el Dockerfile ya define valores por defecto vía ENV).
    env_file:
      - path: .env
        required: false

    # Sobrescribe/agrega variables si es necesario
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_LOG_LEVEL: "INFO"

    ports:
      - "8001:8001"   # temperatura
      - "8002:8002"   # wahapedia
      - "8003:8003"   # monitor
      - "8005:8005"   # shell
      - "8006:8006"   # airbnb
      - "8007:8007"   # charts
      - "8008:8008"   # email
      - "8009:8009"   # mangadex
      - "8010:8010"   # swagger
      - "3000:3000"   # drawio-mcp (HTTP)
      - "3333:3333"   # drawio-mcp (WS extensión)

    volumes:
      # Logs rotados por día: logs/{servidor}_{fecha}.log
      - ./logs:/app/logs
      # Cache de wahapedia y descargas de mangadex
      - ./.aia:/app/.aia

    # Healthcheck: POST initialize MCP al endpoint /mcp de temperatura
    # (GET plano devuelve 406; el MCP Streamable HTTP requiere headers de protocolo)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; req=urllib.request.Request('http://127.0.0.1:8001/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'hc','version':'1.0'}}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}); sys.exit(0 if urllib.request.urlopen(req, timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    command: ["all", "--http"]
