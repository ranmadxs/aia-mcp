name: Docker Image Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a desplegar (ej: 2.2.1)'
        required: true
        default: ''
  push:
    tags:
      - "v*.*.*"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v
      - name: Upload LTP test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ltp
          path: test-report-ltp.txt

  # ── Build: construye la imagen (SIN push) ──────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set docker tag version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "RELEASE_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"
          fi
      - name: Build image (no push)
        run: |
          docker build -t keitarodxs/aia-mcp:${{ env.RELEASE_VERSION }} .
      - name: Save image to artifact
        run: |
          mkdir -p /tmp/image
          docker save keitarodxs/aia-mcp:${{ env.RELEASE_VERSION }} | gzip > /tmp/image/aia-mcp.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: aia-mcp-image
          path: /tmp/image/aia-mcp.tar.gz

  # ── Publish: sube la imagen a Docker Hub ───────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: aia-mcp-image
          path: /tmp/image
      - name: Load image
        run: docker load < /tmp/image/aia-mcp.tar.gz
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Tag and push
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          docker tag keitarodxs/aia-mcp:$TAG keitarodxs/aia-mcp:latest
          docker push keitarodxs/aia-mcp:$TAG
          docker push keitarodxs/aia-mcp:latest
          docker logout

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  # Corre DIRECTAMENTE en el self-hosted runner `nara` (sin SSH). El build de la
  # imagen ocurre arriba en los runners de GitHub; aquí solo se hace pull y up
  # de la imagen ya publicada. Los volúmenes se montan en rutas persistentes de
  # nara (/opt/aia-mcp) fuera del workspace del runner.
  #
  # No consultamos la API de runners (el GITHUB_TOKEN de integración no tiene
  # permiso para /actions/runners -> 403). En su lugar: el job se asigna al
  # runner `nara`; si nara está offline el job se queda en cola y alcanza el
  # timeout (continue-on-error lo deja verde). Si nara está online, despliega.
  deploy-nara:
    needs: publish
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      # Despliegue con docker run puro: pull de la imagen con el TAG exacto
      # que publicó `publish` y levantar el contenedor. Sin compose, sin git.
      - name: Desplegar con docker run en nara
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          IMAGE="keitarodxs/aia-mcp:$TAG"
          docker pull "$IMAGE"
          docker stop aia-mcp 2>/dev/null || true
          docker rm aia-mcp 2>/dev/null || true
          docker run -d --name aia-mcp --restart unless-stopped \
            -p 8001:8001 -p 8002:8002 -p 8003:8003 -p 8005:8005 \
            -p 8006:8006 -p 8007:8007 -p 8008:8008 -p 8009:8009 \
            -p 8010:8010 -p 3000:3000 -p 3333:3333 \
            -v /opt/aia-mcp/logs:/app/logs \
            -v /opt/aia-mcp/.aia:/app/.aia \
            -e FASTMCP_HOST=0.0.0.0 -e FASTMCP_LOG_LEVEL=INFO \
            -e YAHOO_EMAIL="${{ secrets.YAHOO_EMAIL }}" \
            -e YAHOO_APP_PASSWORD="${{ secrets.YAHOO_APP_PASSWORD }}" \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
             -e MONGODB_URI_LOCAL="${{ secrets.MONGODB_URI_LOCAL }}" \
            -e BCI_PDF_PASSWORD="${{ secrets.BCI_PDF_PASSWORD }}" \
            "$IMAGE"
          echo "Despliegue en nara completado (imagen: $IMAGE)"

  # ── Integration Test en nara (best-effort) ──────────────────────────────────
  # Corre en el runner `nara` tras el deploy. Hace curls HTTP a los servidores
  # MCP levantados en el contenedor para verificar que responden (initialize
  # sobre /mcp). Best-effort: no bloquea si nara está offline.
  test-nara:
    needs: deploy-nara
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Esperar a que el contenedor y los servidores estén listos
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker ps --format '{{.Names}}' | grep -qx aia-mcp; then
              echo "contenedor aia-mcp presente"
              break
            fi
            echo "esperando contenedor... ($i)"
            sleep 2
          done
          # Esperar a que el puerto 8001 (temperatura) responda antes de testear
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/mcp \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"it","version":"1.0"}}}' 2>/dev/null; then
              echo "servidor temperatura (:8001) listo"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "TIMEOUT esperando temperatura. Logs del contenedor:"
              docker logs aia-mcp --tail 50 || true
            fi
            echo "esperando servidor temperatura... ($i)"
            sleep 5
          done
      - name: Test temperatura (8001)
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/mcp \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"it","version":"1.0"}}}' 2>/dev/null; then
              echo "temperatura OK"; exit 0
            fi
            echo "esperando temperatura... ($i)"; sleep 3
          done
          echo "TIMEOUT temperatura"; docker logs aia-mcp --tail 30 || true; exit 1
      - name: Test wahapedia (8002)
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8002/mcp \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"it","version":"1.0"}}}' 2>/dev/null; then
              echo "wahapedia OK"; exit 0
            fi
            echo "esperando wahapedia... ($i)"; sleep 3
          done
          echo "TIMEOUT wahapedia"; docker logs aia-mcp --tail 30 || true; exit 1
      - name: Test airbnb (8006)
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8006/mcp \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"it","version":"1.0"}}}' 2>/dev/null; then
              echo "airbnb OK"; exit 0
            fi
            echo "esperando airbnb... ($i)"; sleep 3
          done
          echo "TIMEOUT airbnb"; docker logs aia-mcp --tail 30 || true; exit 1
