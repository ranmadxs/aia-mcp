name: Docker Image Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v

  # ── Build: construye la imagen (SIN push) ──────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set docker tag version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Build image (no push)
        run: |
          docker build -t keitarodxs/aia-mcp:${{ env.RELEASE_VERSION }} .
      - name: Save image to artifact
        run: |
          mkdir -p /tmp/image
          docker save keitarodxs/aia-mcp:${{ env.RELEASE_VERSION }} | gzip > /tmp/image/aia-mcp.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: aia-mcp-image
          path: /tmp/image/aia-mcp.tar.gz

  # ── Publish: sube la imagen a Docker Hub ───────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: aia-mcp-image
          path: /tmp/image
      - name: Load image
        run: docker load < /tmp/image/aia-mcp.tar.gz
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Tag and push
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker tag keitarodxs/aia-mcp:$TAG keitarodxs/aia-mcp:latest
          docker push keitarodxs/aia-mcp:$TAG
          docker push keitarodxs/aia-mcp:latest
          docker logout

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  # Corre DIRECTAMENTE en el self-hosted runner `nara` (sin SSH). El build de la
  # imagen ocurre arriba en los runners de GitHub; aquí solo se hace pull y up
  # de la imagen ya publicada usando docker compose.
  #
  # No consultamos la API de runners (el GITHUB_TOKEN de integración no tiene
  # permiso para /actions/runners -> 403). En su lugar: el job se asigna al
  # runner `nara`; si nara está offline el job se queda en cola y alcanza el
  # timeout (continue-on-error lo deja verde). Si nara está online, despliega.
  deploy-nara:
    needs: publish
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      # NO usamos actions/checkout: checkout intenta limpiar el workspace y
      # choca con logs/ (archivos de dueño root del contenedor) -> EACCES.
      # En su lugar clonamos si no existe .git, o hacemos pull si ya existe.
      - name: Obtener repo (clone o pull)
        run: |
          set -e
          if [ ! -d .git ]; then
            git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${{ github.repository }}.git" .
          else
            git config --global --add safe.directory "$(pwd)"
            git fetch --depth 1 origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
          fi
      - name: Desplegar con docker compose en nara
        run: |
          set -e
          docker compose pull aia-mcp
          docker compose up -d aia-mcp
          echo "Despliegue en nara completado"
