name: Docker Image Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set docker tag version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Test
        run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
      - name: Build & Push to Docker Hub
        # You may pin to the exact commit or the version.
        uses: opspresso/action-docker@master
        with:
          args: --docker
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
          BUILDX: "true"
          PLATFORMS: "linux/amd64"
          IMAGE_NAME: "keitarodxs/aia-mcp"

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  # Corre DIRECTAMENTE en el self-hosted runner `nara` (sin SSH). El build de la
  # imagen ocurre arriba en los runners de GitHub; aquí solo se hace pull y up
  # de la imagen ya publicada usando docker compose.
  #
  # No consultamos la API de runners (el GITHUB_TOKEN de integración no tiene
  # permiso para /actions/runners -> 403). En su lugar: el job se asigna al
  # runner `nara`; si nara está offline el job se queda en cola y alcanza el
  # timeout (continue-on-error lo deja verde). Si nara está online, despliega.
  deploy-nara:
    needs: build
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      # NO usamos actions/checkout: el repo ya está clonado en el workspace del
      # runner (dueño ranmadxs). checkout intenta limpiar el directorio y choca
      # con logs/ (archivos de dueño root del contenedor) -> EACCES. En su lugar
      # hacemos git pull manual dentro del workspace existente.
      - name: Actualizar repo (git pull)
        run: |
          set -e
          git config --global --add safe.directory "$(pwd)"
          git pull --ff-only origin "${GITHUB_REF_NAME}"
      - name: Desplegar con docker compose en nara
        run: |
          set -e
          docker compose pull aia-mcp
          docker compose up -d aia-mcp
          echo "Despliegue en nara completado"
