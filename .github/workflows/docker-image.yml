name: Docker Image Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Run unit tests
        run: poetry run pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    - name: Set docker tag version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Test
      run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
    - name: Build & Push to Docker Hub
      # You may pin to the exact commit or the version.
      uses: opspresso/action-docker@master
      with:
          args: --docker
      env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          #TAG_NAME: ${{ env.RELEASE_VERSION }}
          BUILDX: "true"
          PLATFORMS: "linux/amd64"
          IMAGE_NAME: "keitarodxs/aia-mcp"

  # ── ¿Está nara online? (corre en los runners de GitHub) ────────────────────
  # Si nara no está online, el job hace exit 1 (con continue-on-error el run
  # no falla) y el job deploy-nara se skipea por el needs. Si está online,
  # el job termina OK y deploy-nara corre en el self-hosted runner.
  check-nara:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Consultar estado del runner nara
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONLINE=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '.runners[] | select(.name=="nara") | .status' 2>/dev/null || echo "")
          if [ "$ONLINE" = "online" ]; then
            echo "nara ONLINE -> se desplegará"
          else
            echo "nara NO disponible -> se omite el despliegue"
            exit 1
          fi

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  # Corre DIRECTAMENTE en el self-hosted runner `nara` (sin SSH). El build de la
  # imagen ocurre arriba en los runners de GitHub; aquí solo se hace pull y up
  # de la imagen ya publicada usando docker compose. Solo corre si check-nara
  # terminó OK (nara online).
  deploy-nara:
    needs: check-nara
    if: needs.check-nara.result == 'success'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar con docker compose en nara
        run: |
          set -e
          docker compose pull aia-mcp
          docker compose up -d aia-mcp
          echo "Despliegue en nara completado"
