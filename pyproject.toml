[tool.poetry]
name = "aia-mcp"
version = "1.6.1"
description = "Servidor MCP para el agente aia (amanda-IA)"
authors = ["ranmadxs <ranmadxs@gmail.com>"]
readme = "README.md"
packages = [
    {include = "temperatura"},
    {include = "wahapedia"},
    {include = "monitor"},
    {include = "shell"},
    {include = "mcp_cli"},
    {include = "airbnb"},
    {include = "charts"},
    {include = "mcp_email"},
    {include = "mangadex"},
    {include = "swagger"},
]

[tool.poetry.scripts]
mcp = "mcp_cli.cli:main"
mcp-swagger = "swagger.server:run_server"

[tool.poetry.dependencies]
python = "^3.11"
mcp = ">=1.0"
httpx = ">=0.27"
beautifulsoup4 = ">=4.12"
paho-mqtt = ">=2.0"
python-dotenv = "^1.0"
pymongo = ">=4.0"
matplotlib = ">=3.7"
fastapi = ">=0.115"
uvicorn = ">=0.30"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mcp-swagger-ui (>=0.1.3,<0.2.0)",
    "pytest (>=8.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
